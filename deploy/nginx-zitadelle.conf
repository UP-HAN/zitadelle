server {
    listen 80;
    server_name zitadelle.ches.es.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name zitadelle.ches.es.kr;

    ssl_certificate /etc/letsencrypt/live/zitadelle.ches.es.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zitadelle.ches.es.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/zitadelle;
    index index.html;

    # 기록 동기화 서버 (127.0.0.1:3210, 외부 직접 접근 불가)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3210/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 5M;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
